server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # react-router-dom uses client-side routing — fall back to index.html
    # for any path that isn't a real static asset.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
