services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    extra_hosts:
      # Lets the container reach an Ollama instance running on the host via
      # OLLAMA_BASE_URL=http://host.docker.internal:11434 (localhost inside
      # the container is the container itself, not the host).
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/stats"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        # Browser calls this URL directly, so it must be the host-reachable
        # backend address, not the in-network service name.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
